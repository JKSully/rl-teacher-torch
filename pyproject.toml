[project]
name = "drlhp-torch"
version = "0.0.1"
description = "An updated version of the Deep Reinforcement Learning from Human Preferences codebase in PyTorch"
readme = "README.md"
authors = [{ name = "Jacob Sullivan", email = "jksully@umich.edu" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">= 3.12"

dependencies = [
    "torch",
    "torchvision",
    "stable-baselines3",
    "numpy>=2.0.0",
    "matplotlib",
    "tensorboard",
    "tensordict",
    "tqdm",
    # Preference Interface includes
    "Django",
    "dj_database_url",
    "gunicorn",
    "whitenoise",
    "google-cloud-storage",
    "av",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drlhp", "src/human_feedback_api", "src/human_feedback_site"]
